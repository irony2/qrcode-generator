<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QR 코드 생성기</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>QR 코드 생성기</h2>
    <input type="text" id="text" placeholder="텍스트 또는 URL 입력" />
    <div>
      <button class="generate" onclick="generateQRCode()">QR 코드 생성</button>
      <button class="download" onclick="downloadQRCode()">이미지 다운로드</button>
    </div>
    <div id="qrcode"></div>
  </div>

  <script src="script.js"></script> <!-- JS 파일 연결 -->
</body>
</html>
